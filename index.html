<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KGM 카탈로그 업데이트 현황</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
:root{
  --red:#e70012;
  --red-dark:#c40010;
  --gray:#717171;
  --gray-light:#f2f2f3;
  --border:#e3e3e5;
  --bg:#1b1c20;
  --text:#222226;
  --text-mute:#9a9a9f;
  --amber:#fff2cc;
  --green:#eaf7ee;
  --sticky-shadow: 2px 0 4px rgba(0,0,0,.06);
  --font: 'Pretendard', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --left-code: 42px;
  --left-name: 106px;
  --code-name-bg: #c8e0fb;
  --code-name-bg-hover: #aecdf5;
  --code-name-bg-dark: #163f73;
  --code-name-bg-dark-hover: #1c4a84;
  --paper: #f5f6f8;
  --paper-muted: #ececf0;
  --paper-hover: #edeff3;
  --check-green:#1f9d55;
  --check-blue:#2f6fda;
  /* 상단 툴바(다크) */
  --tb-bg:#242529;
  --tb-border:#333339;
  --tb-text:#f0f0f1;
  --tb-text-mute:#9c9da4;
  --tb-ctrl-bg:#2f3035;
  --tb-ctrl-border:#3c3d43;
  --tb-ctrl-hover:#383941;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);}
body{-webkit-font-smoothing:antialiased;}

/* ── 상단 툴바 ───────────────────────── */
.topbar{
  position:sticky; top:0; z-index:50;
  background:var(--tb-bg); border-bottom:1px solid var(--tb-border);
  padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto;}
.brand h1{font-size:18px; font-weight:800; margin:0; letter-spacing:-.2px; color:var(--tb-text);}
.brand h1 .accent{color:var(--red);}
.brand small{color:var(--tb-text-mute); font-size:12px;}

.stats{display:flex; gap:8px; flex-wrap:wrap;}
.chip{
  background:var(--tb-ctrl-bg); border:1px solid var(--tb-ctrl-border); border-radius:20px;
  padding:5px 12px; font-size:12px; color:var(--tb-text-mute); white-space:nowrap;
}
.chip b{color:var(--tb-text); font-weight:700;}
.chip.confirm-chip b{color:var(--red);}

.search-wrap{position:relative;}
.search-wrap input{
  width:220px; padding:8px 12px 8px 32px; border:1px solid var(--tb-ctrl-border); border-radius:8px;
  font-size:13px; font-family:var(--font); background:var(--tb-ctrl-bg); color:var(--tb-text);
}
.search-wrap input::placeholder{color:var(--tb-text-mute);}
.search-wrap input:focus{outline:none; border-color:var(--red); background:#34353c;}
.search-wrap svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:.6; pointer-events:none;}
.search-count{font-size:12px; color:var(--tb-text-mute); white-space:nowrap;}

.btn{
  border:1px solid var(--tb-ctrl-border); background:var(--tb-ctrl-bg); color:var(--tb-text);
  padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;
  font-family:var(--font); display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.btn:hover{background:var(--tb-ctrl-hover);}
.btn.primary{background:var(--red); border-color:var(--red); color:#fff;}
.btn.primary:hover{background:var(--red-dark);}

.sync{font-size:12px; color:var(--tb-text-mute); display:flex; align-items:center; gap:6px;}
.sync .dot{width:7px; height:7px; border-radius:50%; background:#5cb85c; transition:background .2s;}
.sync.saving .dot{background:#f0ad4e;}

/* ── 메모장 ───────────────────────── */
.memo-wrap{position:relative;}
.memo-badge{
  display:none; width:7px; height:7px; border-radius:50%; margin-left:6px;
  background:var(--red); vertical-align:middle;
}
.memo-badge.show{display:inline-block;}
.memo-panel{
  position:absolute; top:calc(100% + 8px); right:0; width:320px; max-width:86vw;
  background:var(--paper); border:1px solid var(--border); border-radius:12px;
  box-shadow:0 14px 40px rgba(0,0,0,.35);
  display:flex; flex-direction:column; overflow:hidden;
  opacity:0; transform:translateY(-6px); pointer-events:none; transition:opacity .15s, transform .15s;
  z-index:10;
  resize:both; min-width:280px; min-height:230px; max-width:640px; max-height:80vh;
}
.memo-panel.show{opacity:1; transform:translateY(0); pointer-events:auto;}
.memo-panel-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:11px 14px; border-bottom:1px solid var(--border); background:var(--paper-muted);
}
.memo-panel-header strong{font-size:13px; color:var(--text);}
.memo-close{border:none; background:transparent; font-size:16px; color:var(--text-mute); cursor:pointer; line-height:1; padding:2px 6px; border-radius:4px;}
.memo-close:hover{background:var(--paper-hover); color:var(--text);}
.board-meta{padding:8px 14px; font-size:11px; color:var(--text-mute); border-bottom:1px solid var(--border); background:var(--paper-muted);}

.board-toolbar{
  display:flex; align-items:center; gap:5px; padding:6px 10px;
  border-bottom:1px solid var(--border); background:var(--paper-muted); flex-wrap:wrap;
}
.board-tool-btn{
  width:26px; height:26px; border:1px solid var(--border); background:#fff; border-radius:6px;
  cursor:pointer; font-size:12px; color:var(--text); display:flex; align-items:center; justify-content:center;
  font-family:var(--font); line-height:1; padding:0;
}
.board-tool-btn:hover{background:var(--paper-hover);}
.board-tool-sep{width:1px; height:18px; background:var(--border); margin:0 3px;}
.board-color-swatch{
  width:19px; height:19px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--border);
  cursor:pointer; padding:0;
}
.board-color-swatch:hover{box-shadow:0 0 0 1.5px var(--text-mute);}

.board-textarea{
  display:block; width:100%; border:none; padding:12px 14px;
  font-family:var(--font); font-size:13px; background:var(--paper);
  color:var(--text); line-height:1.6; box-sizing:border-box;
  flex:1 1 auto; min-height:80px; overflow-y:auto;
}
.board-textarea:focus{outline:none; background:#fff;}
.board-textarea:empty:before{content:attr(data-placeholder); color:var(--text-mute); pointer-events:none;}
.board-footer{
  display:flex; align-items:center; gap:8px; padding:10px 12px;
  border-top:1px solid var(--border); background:var(--paper-muted);
}
.board-footer input{
  flex:0 0 90px; border:1px solid var(--border); border-radius:8px; padding:6px 8px;
  font-size:12px; font-family:var(--font); background:#fff; color:var(--text);
}
.board-footer input:focus{outline:none; border-color:var(--red);}
.board-save-status{font-size:11px; color:var(--text-mute); margin-left:auto;}

/* ── 테이블 ───────────────────────── */
.table-wrap{
  margin:16px 20px 40px; background:var(--paper); border:1px solid var(--border); border-radius:10px;
  overflow:auto; max-height:calc(100vh - 130px);
  box-shadow:0 10px 34px rgba(0,0,0,.4);
}
table{border-collapse:separate; border-spacing:0; font-size:13px; table-layout:fixed;}
thead th{
  position:sticky; top:0; z-index:5; background:var(--paper-muted); border-bottom:2px solid var(--border);
  border-right:1px solid var(--border); padding:0; white-space:nowrap; overflow:hidden;
}
th .th-inner{position:relative; padding:10px 16px 10px 10px; font-weight:700; color:var(--gray); display:flex; align-items:center; justify-content:center; gap:4px; overflow:hidden;}
th .th-inner > span:first-of-type{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
tbody td{border-bottom:1px solid var(--border); border-right:1px solid var(--border); padding:0; text-align:center; vertical-align:middle; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
tbody tr:hover td{background:var(--paper-hover);}
tbody tr:last-child td{border-bottom:none;}

/* 열 너비 조절 핸들 */
.col-resizer{
  position:absolute; top:0; right:-3px; bottom:0; width:7px; cursor:col-resize; z-index:30; user-select:none;
}
.col-resizer:hover{background:rgba(231,0,18,.28);}
th.add-col .col-resizer{display:none;}

/* 고정(읽기전용) 열 */
td.fixed, th.fixed .th-inner{color:var(--text);}
td.fixed{background:var(--paper-muted); color:#3a3a3e; font-size:12.5px; padding:9px 8px;}
td.fixed.name{text-align:left; font-weight:600; font-size:14.5px; color:var(--gray);}
td.fixed.status.has-value{background:var(--amber);}
td.fixed.status{font-size:12px; color:var(--gray);}

/* sticky 좌측 열: 순번 / 업체코드 / 업체명 (너비는 colgroup이 결정) */
th.col-no, td.col-no{position:sticky; left:0; z-index:3;}
th.col-code, td.col-code{position:sticky; left:var(--left-code); z-index:3;}
th.col-name, td.col-name{position:sticky; left:var(--left-name); z-index:3; box-shadow:var(--sticky-shadow);}
thead th.col-no, thead th.col-code, thead th.col-name{z-index:6; background:var(--paper-muted);}
td.col-no{background:var(--paper-muted);}
tbody tr:hover td.col-no{background:var(--paper-hover);}

/* 업체코드 — 항상 파란 톤으로 구분 */
td.col-code{background:var(--code-name-bg) !important;}
thead th.col-code{background:var(--code-name-bg);}
tbody tr:hover td.col-code{background:var(--code-name-bg-hover) !important;}

/* 업체명 — 기본은 회색 글자 · "데이터 업로드" 체크시에만 파란 배경 (호버해도 유지) */
td.col-name{background:var(--paper-muted) !important;}
thead th.col-name{background:var(--paper-muted);}
td.col-name.data-uploaded{background:var(--code-name-bg) !important; color:var(--text) !important;}

/* 교정확인서 체크된 행 — 업체코드·업체명을 진한 블루로 강조 (최우선) */
tr.confirmed-row td.col-code, tr.confirmed-row td.col-name{
  background:var(--code-name-bg-dark) !important; color:#eaf1fb !important;
}
tr.confirmed-row:hover td.col-code, tr.confirmed-row:hover td.col-name{
  background:var(--code-name-bg-dark-hover) !important;
}

td.col-no{color:var(--text-mute); font-size:11.5px;}
td.col-rep, td.col-phone, td.col-pages{font-size:12.5px;}

td.cb-dataupload input[type=checkbox]{accent-color:#b7b8bd;}
td.cb-dataupload input[type=checkbox]:focus{outline:none;}

/* 편집 가능 셀 */
td.editable{padding:0; background:var(--paper);}
td.editable input{
  width:100%; height:100%; border:none; background:transparent; padding:9px 10px;
  font-size:13px; font-family:var(--font); text-align:center; color:var(--text);
}
td.editable input:focus{outline:none;}

td.note-cell{cursor:pointer; padding:0;}
.note-preview{
  padding:9px 10px; text-align:left; font-size:12.5px; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
td.note-cell:hover{background:var(--paper-hover);}

.note-modal{width:400px;}
#noteModalTextarea{
  width:100%; min-height:150px; padding:10px 12px; border:1px solid var(--border); border-radius:8px;
  font-family:var(--font); font-size:13.5px; line-height:1.6; resize:vertical; margin-bottom:14px; box-sizing:border-box;
}
#noteModalTextarea:focus{outline:none; border-color:var(--red);}

td.checkbox-cell{cursor:pointer;}
td.checkbox-cell input[type=checkbox]{
  width:17px; height:17px; cursor:pointer; vertical-align:middle;
}
td.cb-upload input[type=checkbox]{accent-color:var(--check-green);}
td.cb-confirm input[type=checkbox]{accent-color:var(--red);}
td.cb-upload input[type=checkbox]:focus{outline:none;}
td.cb-confirm input[type=checkbox]:focus{outline:none;}

th.extra .th-inner{gap:2px;}
.col-remove{
  border:none; background:transparent; color:var(--text-mute); cursor:pointer; font-size:14px;
  line-height:1; padding:2px 4px; border-radius:4px; opacity:0; transition:opacity .15s;
}
th.extra:hover .col-remove{opacity:1;}
.col-remove:hover{background:#ffe1e1; color:var(--red);}

th.add-col{width:52px;}
.add-col-btn{
  width:100%; height:100%; border:none; background:transparent; color:var(--text-mute);
  font-size:18px; cursor:pointer; padding:10px 0;
}
.add-col-btn:hover{color:var(--red); background:var(--gray-light);}

.empty-note{padding:60px 20px; text-align:center; color:var(--text-mute); font-size:13px;}

/* ── 실행취소 토스트 ───────────────────────── */
.undo-toast{
  position:fixed; left:50%; bottom:26px; transform:translate(-50%, 16px);
  background:#1f2024; color:#f0f0f1; border:1px solid #35363c; border-radius:10px;
  padding:12px 10px 12px 18px; display:flex; align-items:center; gap:16px;
  box-shadow:0 12px 34px rgba(0,0,0,.45); z-index:150; font-size:13px;
  opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease;
}
.undo-toast.show{opacity:1; transform:translate(-50%, 0); pointer-events:auto;}
.undo-toast-btn{
  background:transparent; border:none; color:#6fa8ff; font-weight:700; font-size:13px;
  cursor:pointer; padding:6px 10px; border-radius:6px; font-family:var(--font);
}
.undo-toast-btn:hover{background:rgba(111,168,255,.14);}

/* ── 열 추가 모달 ───────────────────────── */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(20,20,22,.35); z-index:100;
  display:none; align-items:center; justify-content:center;
}
.modal-backdrop.show{display:flex;}
.modal{
  background:var(--paper); border-radius:12px; padding:22px; width:320px;
  box-shadow:0 12px 40px rgba(0,0,0,.18);
}
.modal h3{margin:0 0 4px; font-size:15px;}
.modal p{margin:0 0 14px; font-size:12.5px; color:var(--text-mute);}
.modal input{
  width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px;
  font-size:14px; font-family:var(--font); margin-bottom:14px;
}
.modal input:focus{outline:none; border-color:var(--red);}
.modal-actions{display:flex; gap:8px; justify-content:flex-end;}

/* ── 로딩 오버레이 ───────────────────────── */
#loadingOverlay{
  position:fixed; inset:0; background:var(--bg); z-index:200;
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
}
.spinner{width:28px; height:28px; border:3px solid var(--tb-ctrl-border); border-top-color:var(--red); border-radius:50%; animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#loadingOverlay span{font-size:13px; color:var(--tb-text-mute);}

/* ── 인쇄 ───────────────────────── */
@media print{
  .topbar, .modal-backdrop, .add-col, .col-remove, .col-resizer, .undo-toast{display:none !important;}
  .table-wrap{margin:0; border:none; max-height:none; overflow:visible;}
  th.col-no, td.col-no, th.col-code, td.col-code, th.col-name, td.col-name{position:static; box-shadow:none;}
  body{background:#fff;}
}

mark{background:#ffe58a; color:inherit; border-radius:2px;}
</style>
</head>
<body>

<div id="loadingOverlay"><div class="spinner"></div><span>데이터 불러오는 중...</span></div>

<div class="topbar">
  <div class="brand">
    <h1>KGM<span class="accent">카탈로그</span> 업데이트 현황</h1>
    <small>갑우 콘텐츠사업부</small>
  </div>

  <div class="stats" id="statsBar"></div>

  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9c9da4" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="searchInput" type="text" placeholder="업체명·대표자·코드 검색">
  </div>
  <span class="search-count" id="searchCount"></span>

  <div class="memo-wrap" id="memoWrap">
    <button class="btn" id="memoBtn">칠판<span class="memo-badge" id="memoBadge"></span></button>
    <div class="memo-panel" id="memoPanel">
      <div class="memo-panel-header">
        <strong>작업 칠판</strong>
        <button class="memo-close" id="memoCloseBtn" title="닫기">×</button>
      </div>
      <div class="board-meta" id="boardMeta">아직 작성된 내용이 없어요.</div>
      <div class="board-toolbar">
        <button type="button" class="board-tool-btn" id="boardBoldBtn" title="굵게"><b>B</b></button>
        <button type="button" class="board-tool-btn" id="boardStrikeBtn" title="취소선(삭제 표시)"><s>S</s></button>
        <span class="board-tool-sep"></span>
        <button type="button" class="board-color-swatch" data-color="#222226" style="background:#222226" title="검정"></button>
        <button type="button" class="board-color-swatch" data-color="#e70012" style="background:#e70012" title="빨강"></button>
        <button type="button" class="board-color-swatch" data-color="#2f6fda" style="background:#2f6fda" title="파랑"></button>
        <button type="button" class="board-color-swatch" data-color="#1f9d55" style="background:#1f9d55" title="초록"></button>
        <button type="button" class="board-color-swatch" data-color="#9a9a9f" style="background:#9a9a9f" title="회색"></button>
      </div>
      <div id="boardEditable" class="board-textarea" contenteditable="true" data-placeholder="여기에 자유롭게 메모를 남기세요. 자동 저장되고 다른 사람 화면에도 실시간으로 보여요."></div>
      <div class="board-footer">
        <input type="text" id="memoAuthorInput" placeholder="이름" maxlength="12">
        <span class="board-save-status" id="boardSaveStatus"></span>
      </div>
    </div>
  </div>

  <button class="btn" id="excelBtn">엑셀 저장</button>
  <button class="btn" id="printBtn">인쇄</button>
  <div class="sync" id="syncIndicator"><span class="dot"></span><span id="syncText">동기화됨</span></div>
</div>

<div class="table-wrap">
  <table id="mainTable">
    <colgroup id="tableColgroup"></colgroup>
    <thead id="tableHead"></thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="modal-backdrop" id="colModalBackdrop">
  <div class="modal">
    <h3>열 추가</h3>
    <p>예: 1교 전화, 2교 전화, 특이사항 등</p>
    <input type="text" id="colNameInput" placeholder="열 이름 입력" maxlength="20">
    <div class="modal-actions">
      <button class="btn" id="colCancelBtn">취소</button>
      <button class="btn primary" id="colAddBtn">추가</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="noteModalBackdrop">
  <div class="modal note-modal">
    <h3 id="noteModalTitle">비고 편집</h3>
    <textarea id="noteModalTextarea" placeholder="자유롭게 입력하세요. 줄바꿈도 가능해요." maxlength="500"></textarea>
    <div class="modal-actions">
      <button class="btn" id="noteCancelBtn">취소</button>
      <button class="btn primary" id="noteSaveBtn">저장</button>
    </div>
  </div>
</div>

<div class="undo-toast" id="undoToast">
  <span id="undoToastText"></span>
  <button class="undo-toast-btn" id="undoToastBtn">실행취소</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ════════════════════════════════════════════

   상태 (Firebase 실시간 동기화 대상)
════════════════════════════════════════════ */
let STATE = { extraCols: [], values: {} };
let DB_REF = null;
let BOARD_REF = null;
let _isRemoteUpdate = false;
let _saveTimers = {};

function normalizeState(st){
  if(!st) return;
  if(!Array.isArray(st.extraCols)) st.extraCols = [];
  if(!st.values || typeof st.values !== 'object') st.values = {};
}

function allCols(){
  return FIXED_EDIT_COLS.concat(STATE.extraCols);
}

/* ════════════════════════════════════════════
   열 너비 (브라우저별 로컬 저장 — 사람마다 다르게 볼 수 있음)
════════════════════════════════════════════ */
const DEFAULT_WIDTHS = {
  no:42, code:64, name:200, upload:96, rep:84, phone:132, pages:80, status:104,
  up1:84, up2:84, up3:84, confirm:96, note:180
};
let COLWIDTHS = {};
try{ COLWIDTHS = JSON.parse(localStorage.getItem('kgmCatalogColWidths') || '{}'); }
catch(e){ COLWIDTHS = {}; }

function getColWidth(key){
  return COLWIDTHS[key] || DEFAULT_WIDTHS[key] || 110;
}
function persistColWidths(){
  try{ localStorage.setItem('kgmCatalogColWidths', JSON.stringify(COLWIDTHS)); }catch(e){}
}
function updateStickyOffsets(){
  const wNo = getColWidth('no');
  const wCode = getColWidth('code');
  document.documentElement.style.setProperty('--left-code', wNo + 'px');
  document.documentElement.style.setProperty('--left-name', (wNo + wCode) + 'px');
}
function startResize(e, key){
  e.preventDefault();
  const startX = e.clientX;
  const startWidth = getColWidth(key);
  const colEl = document.getElementById('col-w-' + key);
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
  function onMove(ev){
    const newW = Math.max(40, startWidth + (ev.clientX - startX));
    COLWIDTHS[key] = newW;
    if(colEl) colEl.style.width = newW + 'px';
    if(key === 'no' || key === 'code') updateStickyOffsets();
  }
  function onUp(){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    persistColWidths();
  }
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}
function resetColWidth(key){
  delete COLWIDTHS[key];
  const colEl = document.getElementById('col-w-' + key);
  if(colEl) colEl.style.width = getColWidth(key) + 'px';
  if(key === 'no' || key === 'code') updateStickyOffsets();
  persistColWidths();
}

/* ════════════════════════════════════════════
   저장 (디바운스 + 동기화 표시)
════════════════════════════════════════════ */
function showSyncSaving(){
  const el = document.getElementById('syncIndicator');
  el.classList.add('saving');
  document.getElementById('syncText').textContent = '저장 중...';
}
function showSyncSaved(){
  const el = document.getElementById('syncIndicator');
  el.classList.remove('saving');
  document.getElementById('syncText').textContent = '동기화됨';
}

function saveValue(companyId, colId, value, immediate){
  if(!STATE.values[companyId]) STATE.values[companyId] = {};
  STATE.values[companyId][colId] = value;
  renderStats();
  if(!DB_REF) return;
  const key = companyId + ':' + colId;
  function doSave(){
    showSyncSaving();
    _isRemoteUpdate = true;
    DB_REF.child('values').child(companyId).child(colId).set(value)
      .then(()=>{ showSyncSaved(); })
      .catch((e)=>{ console.error('저장 실패', e); showSyncSaved(); })
      .finally(()=>{ setTimeout(()=>{_isRemoteUpdate=false;}, 300); });
  }
  clearTimeout(_saveTimers[key]);
  if(immediate){
    doSave();
  } else {
    showSyncSaving();
    _saveTimers[key] = setTimeout(doSave, 450);
  }
}

function saveExtraCols(){
  if(!DB_REF) return;
  showSyncSaving();
  _isRemoteUpdate = true;
  DB_REF.child('extraCols').set(STATE.extraCols)
    .then(()=>{ showSyncSaved(); })
    .finally(()=>{ setTimeout(()=>{_isRemoteUpdate=false;}, 300); });
}

/* ════════════════════════════════════════════
   렌더링
════════════════════════════════════════════ */
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlight(text, query){
  const t = escapeHtml(text);
  if(!query) return t || '&nbsp;';
  const idx = t.toLowerCase().indexOf(query.toLowerCase());
  if(idx === -1) return t || '&nbsp;';
  return t.slice(0,idx) + '<mark>' + t.slice(idx, idx+query.length) + '</mark>' + t.slice(idx+query.length);
}

function notePreviewHtml(val){
  const raw = (val || '').toString().trim();
  if(!raw) return '&nbsp;';
  const firstLine = raw.split('\n')[0];
  const isMultiline = raw.includes('\n');
  let preview = firstLine.length > 26 ? firstLine.slice(0, 26) + '…' : firstLine;
  if(isMultiline && preview === firstLine) preview += '…';
  return escapeHtml(preview);
}

function renderStats(){
  const total = COMPANIES.length;
  const applied = COMPANIES.filter(c => c.pages && c.pages.trim() !== '').length;
  const confirmed = COMPANIES.filter(c => STATE.values[c.id] && !!STATE.values[c.id].confirm).length;
  document.getElementById('statsBar').innerHTML = `
    <span class="chip">전체 <b>${total}</b>개 업체</span>
    <span class="chip">신청 <b>${applied}</b>건</span>
    <span class="chip confirm-chip">교정확인서 완료 <b>${confirmed}</b>건</span>
  `;
}

function renderColgroup(cols){
  let html = '';
  html += `<col id="col-w-no" style="width:${getColWidth('no')}px">`;
  html += `<col id="col-w-code" style="width:${getColWidth('code')}px">`;
  html += `<col id="col-w-name" style="width:${getColWidth('name')}px">`;
  html += `<col id="col-w-upload" style="width:${getColWidth('upload')}px">`;
  html += `<col id="col-w-rep" style="width:${getColWidth('rep')}px">`;
  html += `<col id="col-w-phone" style="width:${getColWidth('phone')}px">`;
  html += `<col id="col-w-pages" style="width:${getColWidth('pages')}px">`;
  html += `<col id="col-w-status" style="width:${getColWidth('status')}px">`;
  cols.forEach(col=>{
    html += `<col id="col-w-${col.id}" style="width:${getColWidth(col.id)}px">`;
  });
  html += `<col id="col-w-addcol" style="width:52px">`;
  return html;
}

function headerCell(key, label, extraClass, removable){
  extraClass = extraClass || '';
  return `<th class="${extraClass}" data-col="${key}">
      <div class="th-inner">
        <span>${escapeHtml(label)}</span>
        ${removable ? `<button class="col-remove" data-remove-col="${key}" title="열 삭제">×</button>` : ''}
        <span class="col-resizer" data-resize-key="${key}" title="드래그로 너비 조절 · 더블클릭으로 초기화"></span>
      </div>
    </th>`;
}

function renderHead(){
  const cols = allCols();
  document.getElementById('tableColgroup').innerHTML = renderColgroup(cols);

  let html = '<tr>';
  html += headerCell('no', '#', 'col-no');
  html += headerCell('code', '업체코드', 'col-code');
  html += headerCell('name', '업체명', 'col-name');
  html += headerCell('upload', '데이터 업로드');
  html += headerCell('rep', '대표자');
  html += headerCell('phone', '전화');
  html += headerCell('pages', '신청페이지');
  html += headerCell('status', '디자인진행상황');
  cols.forEach(col => {
    const isFixed = FIXED_EDIT_COLS.some(f => f.id === col.id);
    html += headerCell(col.id, col.label, isFixed?'':'extra', !isFixed);
  });
  html += `<th class="add-col"><button class="add-col-btn" id="addColBtn" title="열 추가">＋</button></th>`;
  html += '</tr>';
  document.getElementById('tableHead').innerHTML = html;

  document.getElementById('addColBtn').addEventListener('click', openColModal);
  document.querySelectorAll('[data-remove-col]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const colId = btn.getAttribute('data-remove-col');
      const idx = STATE.extraCols.findIndex(c=>c.id===colId);
      if(idx === -1) return;
      const col = STATE.extraCols[idx];
      if(!confirm(`"${col.label}" 열을 삭제할까요?`)) return;
      STATE.extraCols = STATE.extraCols.filter(c=>c.id!==colId);
      saveExtraCols();
      renderHead();
      renderBody();
      showUndoToast(`"${col.label}" 열을 삭제했습니다.`, ()=>{
        STATE.extraCols.splice(idx, 0, col);
        saveExtraCols();
        renderHead();
        renderBody();
      });
    });
  });
  document.querySelectorAll('.col-resizer').forEach(handle=>{
    const key = handle.getAttribute('data-resize-key');
    handle.addEventListener('mousedown', (e)=> startResize(e, key));
    handle.addEventListener('dblclick', (e)=>{ e.stopPropagation(); resetColWidth(key); });
  });

  updateStickyOffsets();
}

function renderBody(){
  const query = document.getElementById('searchInput').value.trim();
  const cols = allCols();
  const tbody = document.getElementById('tableBody');

  const filtered = COMPANIES.filter(c=>{
    if(!query) return true;
    const q = query.toLowerCase();
    return (c.name && c.name.toLowerCase().includes(q))
        || (c.rep && c.rep.toLowerCase().includes(q))
        || (c.code && c.code.toLowerCase().includes(q))
        || (c.phone && c.phone.toLowerCase().includes(q));
  });

  document.getElementById('searchCount').textContent = query ? `${filtered.length}건 검색됨` : '';

  if(filtered.length === 0){
    tbody.innerHTML = `<tr><td colspan="${8+cols.length+1}"><div class="empty-note">검색 결과가 없습니다.</div></td></tr>`;
    return;
  }

  let html = '';
  filtered.forEach((c, i)=>{
    const v = STATE.values[c.id] || {};
    html += `<tr${v.confirm ? ' class="confirmed-row"' : ''}>`;
    html += `<td class="col-no">${i+1}</td>`;
    html += `<td class="col-code fixed">${escapeHtml(c.code) || '&nbsp;'}</td>`;
    html += `<td class="col-name fixed name${v.upload ? ' data-uploaded' : ''}">${highlight(c.name, query)}</td>`;
    html += `<td class="editable checkbox-cell cb-dataupload"><input type="checkbox" data-company="${c.id}" data-col="upload" ${v.upload ? 'checked' : ''}></td>`;
    html += `<td class="fixed col-rep">${highlight(c.rep, query)}</td>`;
    html += `<td class="fixed col-phone">${highlight(c.phone, query)}</td>`;
    html += `<td class="fixed col-pages">${escapeHtml(c.pages) || '<span style="color:#c9c9cc">-</span>'}</td>`;
    html += `<td class="fixed status ${c.status ? 'has-value' : ''}">${escapeHtml(c.status) || '<span style="color:#c9c9cc">-</span>'}</td>`;
    cols.forEach(col=>{
      const val = v[col.id];
      if(col.type === 'checkbox'){
        const cbClass = col.id === 'confirm' ? 'cb-confirm' : 'cb-upload';
        html += `<td class="editable checkbox-cell ${cbClass}"><input type="checkbox" data-company="${c.id}" data-col="${col.id}" ${val ? 'checked' : ''}></td>`;
      } else if(col.id === 'note'){
        html += `<td class="editable note-cell" data-company="${c.id}" title="클릭하여 편집"><div class="note-preview">${notePreviewHtml(val)}</div></td>`;
      } else {
        html += `<td class="editable"><input type="text" data-company="${c.id}" data-col="${col.id}" value="${escapeHtml(val || '')}"></td>`;
      }
    });
    html += `<td></td>`;
    html += '</tr>';
  });
  tbody.innerHTML = html;

  tbody.querySelectorAll('input[type=text][data-company]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      saveValue(inp.getAttribute('data-company'), inp.getAttribute('data-col'), inp.value);
    });
  });
  tbody.querySelectorAll('td.note-cell').forEach(td=>{
    td.addEventListener('click', ()=>{
      const companyId = td.getAttribute('data-company');
      const company = COMPANIES.find(c => String(c.id) === String(companyId));
      openNoteModal(companyId, company ? company.name : '');
    });
  });
  tbody.querySelectorAll('input[type=checkbox][data-company]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const colId = inp.getAttribute('data-col');
      saveValue(inp.getAttribute('data-company'), colId, inp.checked, true);
      const tr = inp.closest('tr');
      if(!tr) return;
      if(colId === 'confirm'){
        tr.classList.toggle('confirmed-row', inp.checked);
      } else if(colId === 'upload'){
        const nameTd = tr.querySelector('td.col-name');
        if(nameTd) nameTd.classList.toggle('data-uploaded', inp.checked);
      }
    });
  });
  tbody.querySelectorAll('td.checkbox-cell').forEach(td=>{
    td.addEventListener('click', (e)=>{
      if(e.target.tagName === 'INPUT') return;
      const cb = td.querySelector('input[type=checkbox]');
      if(!cb) return;
      cb.checked = !cb.checked;
      cb.dispatchEvent(new Event('change'));
    });
  });
}

function renderAll(){
  renderStats();
  renderHead();
  renderBody();
}

function exportExcel(){
  if(typeof XLSX === 'undefined'){
    alert('엑셀 저장 기능을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 다시 시도해주세요.');
    return;
  }
  const cols = allCols();
  const header = ['순번','업체코드','업체명','데이터 업로드','대표자','전화','신청페이지','디자인진행상황', ...cols.map(c=>c.label)];
  const rows = COMPANIES.map((c, i)=>{
    const v = STATE.values[c.id] || {};
    const row = [i+1, c.code, c.name, v.upload ? '완료' : '', c.rep, c.phone, c.pages, c.status];
    cols.forEach(col=>{
      if(col.type === 'checkbox'){
        row.push(v[col.id] ? '완료' : '');
      } else {
        row.push(v[col.id] || '');
      }
    });
    return row;
  });
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  ws['!cols'] = header.map((h, idx)=>({wch: idx===2 ? 24 : (idx===1 ? 10 : 12)}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'KGM카탈로그');
  const t = new Date();
  const stamp = `${t.getFullYear()}${String(t.getMonth()+1).padStart(2,'0')}${String(t.getDate()).padStart(2,'0')}`;
  XLSX.writeFile(wb, `KGM카탈로그_업데이트현황_${stamp}.xlsx`);
}
document.getElementById('excelBtn').addEventListener('click', exportExcel);

function formatMemoTime(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mi = String(d.getMinutes()).padStart(2,'0');
  return `${mm}/${dd} ${hh}:${mi}`;
}

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
(function(){
  const config = {
    apiKey:"AIzaSyDAvC3MkJDZq23kNdt2PmLDrp9uLKLs84U",
    authDomain:"gabwoo-contents.firebaseapp.com",
    databaseURL:"https://gabwoo-contents-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:"gabwoo-contents",
    storageBucket:"gabwoo-contents.firebasestorage.app",
    messagingSenderId:"39901615316",
    appId:"1:39901615316:web:f818749103a8ac82d89741"
  };

  firebase.initializeApp(config);
  /* 기존 연간 프로젝트 Gantt 앱과 같은 보안 경로(gabwoo-k7m9x2) 아래
     별도 하위 경로(catalog)를 사용합니다. 기존 Firebase 보안규칙이
     gabwoo-k7m9x2 경로 전체(하위 포함)에 적용되어 있다면 별도 설정 없이 바로 동작합니다. */
  DB_REF = firebase.database().ref('gabwoo-k7m9x2/catalog');
  BOARD_REF = firebase.database().ref('gabwoo-k7m9x2/catalog/board');

  BOARD_REF.on('value', function(snap){
    renderBoard(snap.val());
  });

  function hideLoading(){
    const el = document.getElementById('loadingOverlay');
    if(el) el.style.display = 'none';
  }

  DB_REF.once('value').then(function(snap){
    const data = snap.val();
    STATE = data ? data : { extraCols: [], values: {} };
    normalizeState(STATE);
    if(!data){ DB_REF.set(STATE); }
    hideLoading();
    renderAll();

    DB_REF.on('value', function(snap2){
      if(_isRemoteUpdate) return;
      const d = snap2.val();
      if(!d) return;
      STATE.extraCols = Array.isArray(d.extraCols) ? d.extraCols : [];
      STATE.values = (d.values && typeof d.values === 'object') ? d.values : {};

      // 현재 포커스 중인 입력칸은 값 갱신에서 제외 (입력 중 덮어쓰기 방지)
      const activeCompany = document.activeElement && document.activeElement.getAttribute
        ? document.activeElement.getAttribute('data-company') : null;
      const activeCol = document.activeElement && document.activeElement.getAttribute
        ? document.activeElement.getAttribute('data-col') : null;

      renderStats();
      renderHead();
      renderBody();

      if(activeCompany && activeCol){
        const sel = `input[data-company="${activeCompany}"][data-col="${activeCol}"]`;
        const el = document.querySelector(sel);
        if(el) el.focus();
      }
    });
  }).catch(function(err){
    console.error('Firebase 연결 실패:', err.message);
    STATE = { extraCols: [], values: {} };
    hideLoading();
    renderAll();
  });
})();
</script>
</body>
</html>
